<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio - Tower Pizza</title>
<style>
  :root { --red: #E11D48; --bg: #fff7f3; --ink: #1f1f1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; }
  header { background: var(--red); color: #fff; padding: 14px 16px; text-align: center; font-weight: 700; font-size: 18px; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  p.dica { text-align: center; margin: 4px 0 16px; font-size: 14px; color: #555; line-height: 1.5; }
  figure { margin: 0 0 20px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.15); background: #eee; }
  figcaption { text-align: center; font-size: 14px; margin-top: 8px; font-weight: 600; }
  figcaption a { color: var(--red); text-decoration: none; }
  .voltar { display: block; text-align: center; background: var(--red); color: #fff; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 12px; margin: 8px 0 24px; }
</style>
</head>
<body>
<header>TOWER PIZZA KOMAKI<br><small>当店のメニュー</small></header>
<main>
  <p class="dica">Toque na foto para ampliar. Para pedir, volte ao app.<br>写真をタップすると拡大できます。ご注文はアプリからどうぞ。</p>

  <figure>
    <a href="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-frente-web.jpg">
      <img src="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-frente-web.jpg" alt="Cardápio - frente / メニュー（表面）">
    </a>
    <figcaption>Frente / 表面 &middot; <a href="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-frente-web.jpg">Abrir grande / 拡大</a></figcaption>
  </figure>

  <figure>
    <a href="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-dentro-web.jpg">
      <img src="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-dentro-web.jpg" alt="Cardápio - dentro / メニュー（裏面）">
    </a>
    <figcaption>Dentro / 裏面 &middot; <a href="https://raw.githubusercontent.com/sanderkeiti/fotos-tower/main/cardapio-dentro-web.jpg">Abrir grande / 拡大</a></figcaption>
  </figure>

  <a class="voltar" href="https://towerpizzaonline.jp/">Voltar ao pedido / 注文に戻る</a>
</main>
</body>
</html>
