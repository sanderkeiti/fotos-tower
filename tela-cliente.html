<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Pizza - Tela do cliente</title>
<style>
  :root{
    --red:#E11D48; --red-dark:#BE123C; --bg:#FAF7F5; --card:#FFFFFF;
    --ink:#292524; --muted:#78716C; --line:#E7E2DE; --ok:#16A34A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Roboto,Arial,sans-serif;
    overflow:hidden;
  }
  /* ---------- moldura: ocupa a tela toda ---------- */
  .tela{height:100vh;display:none;flex-direction:column}
  .tela.ativa{display:flex}

  /* ---------- topo ---------- */
  .topo{
    background:var(--red); color:#fff;
    display:flex;align-items:center;gap:14px;
    padding:10px 20px; min-height:68px;
  }
  .topo img{height:48px;width:48px;border-radius:12px;background:#fff;padding:3px;object-fit:contain}
  .topo .nome{font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1.1}
  .topo .sub{font-size:14px;opacity:.9}
  .topo .dir{margin-left:auto;text-align:right}
  .topo .dir b{display:block;font-size:22px}
  .topo .dir span{font-size:14px;opacity:.9}

  /* ---------- conta ---------- */
  .corpo{flex:1;min-height:0;display:flex;gap:18px;padding:18px 20px}
  .lista{
    flex:1.55;min-width:0;background:var(--card);border-radius:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    padding:6px 22px; overflow:auto;
  }
  .item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .qtd{
    flex:0 0 auto;min-width:54px;height:54px;border-radius:14px;
    background:#FFE4EA;color:var(--red-dark);
    font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .desc{flex:1;min-width:0}
  .desc .ja{font-size:24px;font-weight:700;line-height:1.25}
  .desc .pt{font-size:15px;color:var(--muted);margin-top:2px}
  .desc .det{font-size:15px;color:var(--red-dark);margin-top:3px;font-weight:600}
  .preco{flex:0 0 auto;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

  .resumo{
    flex:1;min-width:250px;display:flex;flex-direction:column;gap:14px;
  }
  .total{
    background:var(--red);color:#fff;border-radius:20px;padding:20px 22px;
    box-shadow:0 4px 14px rgba(225,29,72,.35);
  }
  .total .rot{font-size:18px;opacity:.95;font-weight:600}
  .total .valor{font-size:64px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
  .total .nota{font-size:14px;opacity:.9;margin-top:4px}
  .imp{
    background:var(--card);border-radius:20px;padding:14px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:17px;color:var(--muted)
  }
  .imp div{display:flex;justify-content:space-between;padding:4px 0}
  .imp b{color:var(--ink);font-variant-numeric:tabular-nums}
  .obrig{
    margin-top:auto;text-align:center;font-size:20px;font-weight:700;color:var(--red-dark);
    line-height:1.4;padding:6px
  }
  .obrig small{display:block;font-size:14px;font-weight:500;color:var(--muted)}

  /* ---------- aguardando ---------- */
  .espera{align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--bg)}
  .espera img{width:min(34vh,260px);height:auto;border-radius:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  .espera h1{font-size:44px;color:var(--red);font-weight:900;margin-top:10px}
  .espera p{font-size:22px;color:var(--muted)}

  /* ---------- pago ---------- */
  .pago{align-items:center;justify-content:center;text-align:center;background:#fff;gap:6px}
  .pago .check{
    width:150px;height:150px;border-radius:50%;background:var(--ok);
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;
    animation:pop .5s ease-out both;
  }
  .pago .check svg{width:84px;height:84px}
  .pago h1{font-size:58px;font-weight:900;color:var(--ok)}
  .pago h2{font-size:34px;font-weight:700;color:var(--ink)}
  .pago p{font-size:22px;color:var(--muted);margin-top:10px}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

  /* ---------- retrato (tablet em pe) ---------- */
  @media (orientation:portrait){
    .corpo{flex-direction:column}
    .lista{flex:1}
    .resumo{flex:0 0 auto;flex-direction:column}
    .total .valor{font-size:56px}
    .obrig{display:none}
  }
  /* telas pequenas */
  @media (max-height:520px){
    .topo{min-height:56px;padding:6px 16px}.topo img{height:40px;width:40px}
    .item{padding:9px 0}.desc .ja{font-size:20px}.preco{font-size:22px}.qtd{min-width:46px;height:46px;font-size:22px}
    .total .valor{font-size:50px}
  }

  .lista:empty{display:none}
</style>
</head>

}
function yen(n){ return '\u00a5' + String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

}
function desenharAgora(d){
  ultimoEstado = (d && d.estado) ? d.estado : 'espera';
  if (!d || d.estado === 'espera' || (d.estado !== 'pago' && (!d.itens || !d.itens.length))) { ver('t-espera'); return; }
  if (d.estado === 'pago') { ver('t-pago'); return; }
  document.getElementById('c-nome').textContent = d.nome ? d.nome + ' \u69d8' : '';
  document.getElementById('c-tipo').textContent = tipoTxt(d);
  var h = '';
  for (var i=0;i<d.itens.length;i++){
    var it = d.itens[i];
    var ja = it.sac ? '\u30ec\u30b8\u888b' : it.ja;
    var pt = it.sac ? 'Sacola' : it.pt;
    var partes = [];
    if (tamTxt(it.tam)) partes.push(tamTxt(it.tam));
    if (it.det) partes.push(it.det);
    h += '<div class="item"><div class="qtd">' + esc(it.q) + '\u00d7</div><div class="desc">' +
         '<div class="ja">' + esc(ja) + '</div>' +
         (pt ? '<div class="pt">' + esc(pt) + '</div>' : '') +
         (partes.length ? '<div class="det">' + esc(partes.join(' \u00b7 ')) + '</div>' : '') +
         '</div><div class="preco">' + yen(it.preco) + '</div></div>';
  }
  if (d.desc > 0) {
    h += '<div class="item"><div class="qtd"></div><div class="desc">' +
         '<div class="ja">割引</div><div class="pt">Desconto</div></div>' +
         '<div class="preco">-' + yen(d.desc) + '</div></div>';
  }
  document.getElementById('c-lista').innerHTML = h;
  document.getElementById('c-total').textContent = yen(d.total);
  var im = '';
  for (var j=0;j<(d.imp||[]).length;j++) im += '<div><span>' + ZEI + ' ' + d.imp[j][0] + '% / Imposto ' + d.imp[j][0] + '%</span><b>' + yen(d.imp[j][1]) + '</b></div>';
  document.getElementById('c-imp').innerHTML = im;
  ver('t-conta');
}var pagoDesde = 0, tmrPago = null;
function desenhar(d){
  var agora = Date.now();
  if (pagoDesde && !(d && d.estado === 'pago') && (agora - pagoDesde) < 10000) {
    clearTimeout(tmrPago);
    tmrPago = setTimeout(function(){ pagoDesde = 0; desenharAgora(d); }, 10000 - (agora - pagoDesde));
    return;
  }
  if (d && d.estado === 'pago') { if (!pagoDesde) pagoDesde = agora; } else { pagoDesde = 0; }
  desenharAgora(d);
}function ler(){
  var x = new XMLHttpRequest();
  x.open('GET', URL_DOC + '?t=' + Date.now());
  x.timeout = 6000;
  x.onload = function(){
    if (x.status === 404) { ver('t-espera'); return; }
    if (x.status !== 200) return;
    try {
      var doc = JSON.parse(x.responseText);
      var txt = doc.fields && doc.fields.json ? doc.fields.json.stringValue : '';
      if (txt === ultimo) return;
      ultimo = txt;
      desenhar(txt ? JSON.parse(txt) : null);
    } catch (e) {}
  };
  x.send();
}
/* Economia de leituras do Firestore (plano gratuito = ~50 mil/dia):
   conta aberta ou paga = a cada 2 s; sem conta (espera) = 5 s; aba escondida = 30 s;
   fora do horario de funcionamento (Japao, antes das 10h) = 60 s. */
var ultimoEstado = 'espera';
function proximaEspera(){
  var h = (new Date().getUTCHours() + 9) % 24;
  if (h < 10) return 60000;
  if (document.hidden) return 30000;
  return (pagoDesde || ultimoEstado === 'conta') ? 2000 : 5000;
}
function ciclo(){
  ler();
  setTimeout(ciclo, proximaEspera());
}
ciclo();
</script>
